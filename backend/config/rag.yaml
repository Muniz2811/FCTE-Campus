  - pendente
  - rejeitado
  abrangencias_validas:
  - Gama
  - UnB geral
  - DF
  tipos_validos:
  - pagina_web
  - pdf
  - ficha
  validade_desconhecida: desconhecida
  meta_aprovados: 20
aquisicao:
